<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zmiana hasła</title><link rel="stylesheet" href="/style.css"></head>
<body class="auth-page">
  <div class="auth-card">
    <div class="logo">UBB</div>
    <h1>Zmiana hasła</h1>
    <p class="page-sub"><span data-who></span> · <span data-idle></span></p>
    <div id="forced" class="msg ok" hidden>To Twoje pierwsze logowanie (lub hasło wygasło). Ustaw własne hasło, aby kontynuować.</div>
    <form id="form">
      <div class="field"><label for="old">Obecne hasło (lub hasło jednorazowe)</label>
        <input id="old" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="new1">Nowe hasło</label>
        <input id="new1" type="password" autocomplete="new-password" required></div>
      <div class="field"><label for="new2">Powtórz nowe hasło</label>
        <input id="new2" type="password" autocomplete="new-password" required>
        <p class="hint">Min. 15 znaków, bez sekwencji typu qwerty, asdf, 1234, abcd. Najlepiej długa fraza z kilku słów.</p></div>
      <div class="form-actions">
        <button type="submit">Zmień hasło</button>
        <a id="back" class="btn btn-outline" href="/app" hidden>Powrót</a>
        <button type="button" class="btn-outline" onclick="logout()">Wyloguj</button>
      </div>
    </form>
    <div id="msg" class="msg"></div>
  </div>
<script src="/common.js"></script>
<script>
  loadMe().then((me) => {
    if (me.mustChange) { const f = document.getElementById('forced'); f.hidden = false; f.style.display = 'block'; f.style.marginTop = '0'; f.style.marginBottom = '16px'; }
    else document.getElementById('back').hidden = false;
    if (me.permissions.includes('users.manage')) document.getElementById('back').href = '/admin';
  });
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { ok, data } = await api('POST', '/api/change-password', {
      oldPassword: document.getElementById('old').value,
      newPassword: document.getElementById('new1').value,
      newPassword2: document.getElementById('new2').value,
    });
    const msg = document.getElementById('msg');
    if (!ok) return showMsg(msg, (data.errors || [data.error]).join('\n'));
    showMsg(msg, 'Hasło zostało zmienione.', 'ok');
    e.target.reset();
    setTimeout(() => { location.href = data.next; }, 1000);
  });
</script>
</body>
</html>
